name: rust-daemon-tests

on:
  push:
    paths:
      - 'mac-daemon/**'
      - '.github/workflows/rust-daemon.yml'
  pull_request:
    paths:
      - 'mac-daemon/**'
      - '.github/workflows/rust-daemon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Rust daemon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install BLE system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libudev-dev pkg-config
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac-daemon
      - name: Build and test
        working-directory: mac-daemon
        run: |
          cargo test --workspace
          cargo build --workspace
