name: rust-daemon-tests

on:
  push:
    paths:
      - 'mac-daemon/**'
      - '.github/workflows/rust-daemon.yml'
  pull_request:
    paths:
      - 'mac-daemon/**'
      - '.github/workflows/rust-daemon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test Rust daemon (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install BLE system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libudev-dev pkg-config
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Restore Cargo build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac-daemon
      - name: Build and test
        working-directory: mac-daemon
        run: |
          cargo test --workspace
          cargo build --workspace
